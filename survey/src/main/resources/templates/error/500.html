<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エラー - 500</title>
<style>
*{box-sizing:border-box}
body{
    margin:0; min-height:100vh; display:flex; justify-content:center;
    align-items:center; background:#f8f9fa;
    font-family:"Noto Sans JP","Yu Gothic",sans-serif; color:#333;
}
.error-container{
    width:90%; max-width:600px; padding:50px 30px; text-align:center;
    background:#fff; border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}
.error-code{
    margin:0; font-size:100px; font-weight:bold; line-height:1;
    color:#f38ba8;
}
h1{margin:25px 0 15px;font-size:28px}
p{margin:8px 0;line-height:1.8;color:#666}
.back-button{
    display:inline-block; margin-top:30px; padding:13px 28px;
    border-radius:8px; background:#f38ba8; color:#fff;
    text-decoration:none; font-weight:bold;
}
.back-button:hover{opacity:.8}
@media(max-width:600px){
    .error-container{padding:40px 20px}
    .error-code{font-size:80px}
    h1{font-size:23px}
}
</style>
</head>
<body>
<div class="error-container">
    <p class="error-code">500</p>
    <h1>サーバーエラーが発生しました</h1>
    <p>申し訳ありません。<br>サーバー側で問題が発生しました。</p>
    <p>しばらく時間をおいてから、もう一度お試しください。</p>
</div>
</body>
</html>
