<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回答一覧</title>
</head>
<body>
  <h1>回答一覧</h1>

  <p th:if="${#lists.isEmpty(list)}">回答はまだありません。</p>

  <table th:unless="${#lists.isEmpty(list)}" border="1">
    <thead>
      <tr>
        <th>名前</th>
        <th>日付</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="value : ${list}">
        <td th:text="${value.name}"></td>
        <td th:text="${value.date}"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
